apiVersion: v1
kind: Service
metadata:
  # Nom du service
  name: weather-app-service
spec:
  # LoadBalancer = crée une URL publique accessible depuis internet
  type: {{ .Values.service.type }}
  selector:
    app: weather-app
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}           # port externe (80)
      targetPort: {{ .Values.service.targetPort }} # port interne (8085)
      