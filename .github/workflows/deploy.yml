name: CI/CD Pipeline

# Se déclenche à chaque push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupère le code depuis GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # Étape 2 : Configure les credentials AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          
      - name: Debug AWS identity
        run: aws sts get-caller-identity

      # Étape 3 : Connecte Docker à ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | \
          docker login --username AWS --password-stdin \
          354328790859.dkr.ecr.us-east-1.amazonaws.com

      # Étape 4 : Build l'image Docker
      - name: Build Docker image
        run: |
          docker build -t demo-weather-app .
          docker tag demo-weather-app:latest \
          354328790859.dkr.ecr.us-east-1.amazonaws.com/demo-weather-app:${{ github.sha }}

      # Étape 5 : Push l'image vers ECR
      - name: Push to ECR
        run: |
          docker push \
          354328790859.dkr.ecr.us-east-1.amazonaws.com/demo-weather-app:${{ github.sha }}

      # Étape 6a : Met à jour AWS CLI vers la dernière version
      # (une version trop ancienne génère un kubeconfig avec une API
      # d'authentification obsolète, incompatible avec les kubectl/helm récents,
      # ce qui provoque "the server has asked for the client to provide credentials")
      - name: Update AWS CLI
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      # Étape 6b : Configure kubectl pour EKS
      # Pas de --role-arn : brahim accède au cluster directement via un
      # Access Entry EKS (eks-cluster-role est le rôle de service du
      # cluster, il ne peut pas être assumé par un utilisateur IAM).
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
          --region us-east-1 \
          --name demo-cluster

      # Étape 6c : Vérifie que l'authentification au cluster fonctionne
      # avant de lancer le déploiement Helm (échec rapide, message plus clair)
      - name: Verify cluster access
        run: kubectl get nodes

      # Étape 7 : Installe Helm
      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      # Étape 8 : Déploie sur EKS avec Helm
      - name: Deploy with Helm
        run: |
          helm upgrade --install weather-app ./weather-chart \
          --set image.tag=${{ github.sha }}

          